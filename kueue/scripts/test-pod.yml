apiVersion: v1
kind: Pod
metadata:
  name: whisper-transcription-pod
  # namespace: your-namespace # Uncomment this if you're using a specific namespace
spec:
  containers:
  - name: whisper-container
    image: quay.io/smalleni/whisper:latest
    command: ["sleep"]
    args: ["inf"]
    
    # This is where the volume is mounted *inside* the container
    volumeMounts:
    - name: transcript-data  # Must match the volume name below
      mountPath: /transcriptions
    
    # You would typically add commands/args here to run your app
    # command: ["python", "transcribe.py", "--audio-file", "/path/to/audio"]
    # args: ["--model", "large"]

  # This section defines the volume source for the pod
  volumes:
  - name: transcript-data  # The name we give to this volume
    
    # This specifies that the volume's source is an existing PVC
    persistentVolumeClaim:
      claimName: whisper-storage # The name of your PVC
      
  # For a transcription job, you usually want it to run once and stop.
  # 'Never' ensures it doesn't restart after completing.
  # 'OnFailure' is also a common choice.
  restartPolicy: Never
